name: Open Channel feed check

on:
  schedule:
    - cron: "23 5,17 * * *"   # twice a day, UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check feeds
        run: python3 scripts/open_channel_check.py open-channel.html open-channel-status.json
      - name: Commit status file
        run: |
          git config user.name "open-channel-check"
          git config user.email "actions@users.noreply.github.com"
          git add open-channel-status.json
          git diff --cached --quiet || (git commit -m "Open Channel: update feed status" && git push)
